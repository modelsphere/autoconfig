# 打 tag 自动 build autoconfig 镜像并 push 到 harbor。
#
# 参考同组 llm-openresty/chat-engine 惯例:org 共享 `public-buildx` runner —— docker daemon 已内置
# harbor 鉴权,CI 里不需要 docker login、也不需要配 HARBOR_ 变量,直接 docker build + docker push。
#
# 镜像多阶段 build:builder = harbor.4pd.io/library/golang:1.23.3-alpine3.20,依赖已 vendor(vendor/ 入库),
# `go build -mod=vendor` 不联网 —— public-buildx runner 只有 go1.17.6 且够不到外网/docker.io 也能 build。
#
# 触发:仅打 git tag。产物 harbor.4pd.io/hardcore-tech/autoconfig:<tag> (+ :latest)。
# 生效前提:本文件要在【被打 tag 的 commit】上(先合进 main),再打 tag。

stages: [build]

variables:
  IMAGE: harbor.4pd.io/hardcore-tech/autoconfig                 # controller
  RELOAD_IMAGE: harbor.4pd.io/hardcore-tech/autoconfig-reload   # reload sidecar(独立小镜像)
  HAGATE_IMAGE: harbor.4pd.io/hardcore-tech/autoconfig-hagate   # master-standby leader 选举门控 sidecar

build:image:
  stage: build
  tags: [public-buildx]            # org 共享构建 runner(在线到 harbor;docker 已 login harbor)
  rules:
    - if: '$CI_COMMIT_TAG'         # 只在打 tag 时构建;其它 push 不触发
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"

build:reload:
  stage: build
  tags: [public-buildx]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build -f Dockerfile.reload -t "$RELOAD_IMAGE:$CI_COMMIT_TAG" -t "$RELOAD_IMAGE:latest" .
    - docker push "$RELOAD_IMAGE:$CI_COMMIT_TAG"
    - docker push "$RELOAD_IMAGE:latest"

build:hagate:
  stage: build
  tags: [public-buildx]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build -f Dockerfile.hagate -t "$HAGATE_IMAGE:$CI_COMMIT_TAG" -t "$HAGATE_IMAGE:latest" .
    - docker push "$HAGATE_IMAGE:$CI_COMMIT_TAG"
    - docker push "$HAGATE_IMAGE:latest"
