image:
  repository: harbor.4pd.io/hardcore-tech/llm-openresty
  tag: ""              # 缺省用 Chart.appVersion(0.2.0-routes,基座 baked 版)
  pullPolicy: IfNotPresent

replicas: 1

# 路由 ConfigMap(挂到 conf.d/routes/):**chart 创建初值**,autoconfig 更新(等价手动改 CM;
# Helm 3 三方合并:模板不变时 upgrade 不覆盖 autoconfig 加的 key)。没 autoconfig 时手动编辑此 CM 即可。
configMapName: openresty-conf
initialRoutes: {}          # 初始 session_route_<route>.conf(文件名: 内容);默认空(仅框架起,路由由 autoconfig 填)

# reload sidecar:同一个 autoconfig-reload 镜像,watch conf.d/routes 变化 → SIGHUP nginx master。
reload:
  enabled: true
  image: harbor.4pd.io/hardcore-tech/autoconfig-reload:0.3.2
  process: "nginx: master"

service:
  type: ClusterIP
  ports:               # 与各 ModelRoute.openresty.listen 对应(按需增删)
    - { name: glm, port: 18083 }
    - { name: k25, port: 18080 }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "2", memory: 1Gi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
fullnameOverride: ""
