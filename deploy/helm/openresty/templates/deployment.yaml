apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openresty.fullname" . }}
  labels: {{- include "openresty.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "openresty.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openresty.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "openresty.fullname" . }}   # ha-gate 用它管 Lease
      {{- end }}
      {{- if .Values.reload.enabled }}
      shareProcessNamespace: true   # reload sidecar 靠此给 nginx master 发 SIGHUP
      {{- end }}
      containers:
        - name: openresty
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- range .Values.service.ports }}
            - containerPort: {{ .port }}
            {{- end }}
          volumeMounts:
            - name: routes                                                    # autoconfig 的路由 conf(整卷挂)
              mountPath: /usr/local/openresty/nginx/conf/conf.d/routes
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:                    # master 进程存活(不看端口——空路由时无 listener 属正常)
            exec:
              command: ["sh", "-c", "pgrep -f 'nginx: master' >/dev/null"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:                   # 健康即 Ready(主备两副本都 Ready,Deployment 滚动正常);
            exec:                            # 谁收流量由 ha-gate 的 active 标签 + Service selector 决定
              command: ["sh", "-c", "pgrep -f 'nginx: master' >/dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.reload.enabled }}
        - name: reload
          image: {{ .Values.reload.image }}
          args: ["--watch", "/watch", "--process", {{ .Values.reload.process | quote }}]
          volumeMounts:
            - name: routes
              mountPath: /watch
        {{- end }}
        {{- if .Values.ha.enabled }}
        - name: hagate                       # master-standby:只有 leader 给自己打 ha-active 标签 → 只有它进 Service
          image: {{ .Values.ha.image }}
          args: ["--lease", "{{ include "openresty.fullname" . }}-ha", "--http", ":{{ .Values.ha.port }}", "--app-tcp", {{ .Values.ha.appTcp | quote }}, "--label-key", "{{ include "openresty.name" . }}-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
        {{- end }}
      volumes:
        - name: routes
          configMap:
            name: {{ .Values.configMapName }}
      {{- if or .Values.affinity .Values.ha.enabled }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:                     # 主备尽量分散到不同节点(软约束,单节点也能起)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "openresty.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
