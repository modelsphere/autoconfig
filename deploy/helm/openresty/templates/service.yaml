apiVersion: v1
kind: Service
metadata:
  name: {{ include "openresty.fullname" . }}
  labels: {{- include "openresty.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "openresty.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- end }}
