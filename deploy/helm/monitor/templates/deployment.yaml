apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitor.fullname" . }}
  labels: {{- include "monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "monitor.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "monitor.fullname" . }}   # ha-gate 用它管 Lease
      {{- end }}
      containers:
        - name: monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: mconf                 # base + autoconfig services 同一 ConfigMap;monitor 60s 自热加载(无 sidecar)
              mountPath: /etc/monitor/conf.d
          {{- if .Values.livenessProbe.enabled }}
          startupProbe:                   # 慢启动预算:dashboard 端口起来前不判 live(最多 ~60s)
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                  # startup 过后才生效 → snappy 快抓假死
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.ha.enabled }}
        - name: hagate                    # ⚠️ 默认关:标签门控只挡 dashboard 流量,挡不住 monitor 自主采集/告警循环
          image: {{ .Values.ha.image }}   #    → 真 monitor 主备要按 leader 门控进程(monitor 侧改造),这里仅 dashboard 主备
          args: ["--lease", "{{ include "monitor.fullname" . }}-ha", "--http", ":{{ .Values.ha.port }}", "--app-tcp", {{ .Values.ha.appTcp | quote }}, "--label-key", "{{ include "monitor.name" . }}-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
        {{- end }}
      volumes:
        - name: mconf
          configMap:
            name: {{ .Values.configMapName }}
      {{- if or .Values.affinity .Values.ha.enabled }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:                  # 主备尽量分散到不同节点(软约束)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "monitor.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
