apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitor.fullname" . }}
  labels: {{- include "monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "monitor.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
