image:
  repository: harbor.4pd.io/hardcore-tech/llm-monitor
  tag: ""              # 缺省用 Chart.appVersion(0.1.0)
  pullPolicy: IfNotPresent

replicas: 1

# monitor conf.d ConfigMap:**chart 建初值**(base 阈值 + 可选初始 services),autoconfig 更新
# (每模型一个 <model>.monitor.conf key;Helm 3 三方合并:模板不变时 upgrade 不覆盖 autoconfig 加的 key)。
# 没 autoconfig 时手动编辑此 CM 加 service 行即可。
configMapName: monitor-conf

# 本 chart 提供的 base 阈值(存为 00-base.conf key)。
baseConfig: |
  alert_ttft: 80
  gpu_temp_warn: 75

initialServices: {}    # 可选初始 service 文件(文件名: 内容);默认空,由 autoconfig 填

service:
  type: ClusterIP
  port: 8080           # dashboard

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

env: []                # 机器级凭证(WEB_TPM_AUTH 等)按需在此注入
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
fullnameOverride: ""
