---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: modelroutes.routing.gpucluster.io
spec:
  group: routing.gpucluster.io
  names:
    kind: ModelRoute
    listKind: ModelRouteList
    plural: modelroutes
    shortNames:
    - mr
    singular: modelroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.backends
      name: Backends
      type: integer
    - jsonPath: .status.cartPeers
      name: CART
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelRoute 把「一个模型的后端」自动同步到 openresty 的 peers 与 CART 的 workers。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelRouteSpec 是一个模型的完整路由绑定。
            properties:
              cart:
                description: Cart:可选;有 = autoconfig 管这个 CART,无 = nginx 直连后端。
                properties:
                  maxLoad:
                    description: MaxLoad:每 worker 的 max_load,默认 20。
                    type: integer
                  outputConfigMap:
                    description: |-
                      OutputConfigMap:autoconfig 写 CART 的 config.yaml 到这("ns/name")。
                      底稿(server/cache/health)由 chart 的 values.baseConfig 建在此 ConfigMap 里;autoconfig 只重填 workers 段。
                    type: string
                  port:
                    description: Port:CART 端口。省略则从 EndpointSlice/containerPort 自动推导(单端口)。
                    type: integer
                  selector:
                    type: string
                  service:
                    description: CART pod 的发现(供 openresty 的 cart source);service/selector
                      二选一。service 支持 "ns/name" 跨 ns。
                    type: string
                required:
                - outputConfigMap
                type: object
                x-kubernetes-validations:
                - message: 'cart: service 和 selector 必须恰好给一个'
                  rule: has(self.service) != has(self.selector)
              discovery:
                description: Discovery:本模型的后端桶(喂 CART 的 workers、nginx 的 backend 来源、monitor
                  的 services)。
                properties:
                  includeNotReady:
                    description: IncludeNotReady:默认 false 只取 Ready 端点(排空中端点自动排除)。
                    type: boolean
                  port:
                    description: Port:后端服务端口(配 pod IP)。省略则自动推导:service 路径从 EndpointSlice
                      取、selector 路径从 containerPort 取(仅单端口可推)。
                    type: integer
                  selector:
                    description: Selector:走 pod label 发现(兜底:没建 Service 的单机/单卡)。
                    type: string
                  service:
                    description: |-
                      Service:走 EndpointSlice 发现(推荐);该 Service 需只选服务端点(LWS Service 配成只选 leader)。
                      支持 "ns/name" 跨 ns 发现(裸名默认与 ModelRoute 同 ns),让 ModelRoute 可放中心 ns。
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'discovery: service 和 selector 必须恰好给一个'
                  rule: has(self.service) != has(self.selector)
              monitor:
                description: Monitor:可选;有 = 把发现的后端也写进 monitor 的 services(monitor 60s
                  自热加载,无 sidecar)。
                properties:
                  gpuType:
                    description: |-
                      GPUType:monitor service 行的 gpu_type 字段(如 H100 / A100 / H200)。省略 = 从后端所在节点的
                      GPU label(nvidia.com/gpu.product,GFD 打)自动推导成短名;推不出(无 label / 无 GFD)则留空。显式配则覆盖。
                    type: string
                  model:
                    description: Model:monitor service 行的 model 字段(served-model-name);省略
                      = metadata.name。
                    type: string
                  nginx:
                    description: |-
                      Nginx:可选,默认 true(当 spec.nginx 配了 service/selector);复用 nginx 入口发现,写 monitor 的 nginx: 行
                      (端口用 spec.nginx.listen,每端口 = 一个模型,name = 本模型)。设 false 关闭。
                    type: boolean
                  outputConfigMap:
                    description: OutputConfigMap:autoconfig 写 monitor 配置的 ConfigMap("ns/name",多模型共享,每模型一个
                      key)。
                    type: string
                  router:
                    description: 'Router:可选,默认 true(当配了 spec.cart);复用 spec.cart 发现的
                      CART pod,写 monitor 的 router: 表(.../workers)。设 false 关闭。'
                    type: boolean
                required:
                - outputConfigMap
                type: object
              nginx:
                description: Nginx:nginx(openresty)路由。
                properties:
                  outputConfigMap:
                    description: OutputConfigMap:输出 ConfigMap("ns/name",多路由共享,每路由一个
                      key)。
                    type: string
                  peers:
                    description: Peers:有序 peer 组(如 cart 优先 + backend 兜底)。
                    items:
                      description: RoutePeer:openresty 一条 route 的一组 peer 来源(cart 组
                        / backend 组)。
                      properties:
                        maxConcurrency:
                          description: MaxConcurrency:该组所有 peer 的并发上限;省略用 values.default_max。
                          type: integer
                        maxConcurrencyFromBackend:
                          description: |-
                            MaxConcurrencyFromBackend:仅 use:cart 有意义。true = cart 的并发上限动态 = 后端单实例并发 × 后端数
                            (CART 扇出到 N 个后端,总容量=各后端容量之和,随后端扩缩自动变)。设了它就忽略静态 MaxConcurrency。
                            后端单实例并发取 use:backend 组的 maxConcurrency —— CEL 校验强制此时它必须 > 0(见 ModelRouteSpec)。
                          type: boolean
                        priority:
                          description: Priority:openresty peer 优先级(CART 优先=1,后端兜底=0)。
                          type: integer
                        probePath:
                          description: |-
                            ProbePath:该层 openresty 健康探测路径覆盖(GET <path> 状态行含 200=健康,否则 ban)。
                            省略时:use:cart 默认 "/health"(cache_aware_router 的 /v1/models 是缓存端点、worker 全挂也返 200
                            不能当健康信号;/health 是 worker-aware 的),其余层默认空=用 route 的 health_probe_path(/v1/models)。
                            显式设值(含对 cart 设为 "/v1/models")覆盖默认。
                          type: string
                        use:
                          description: |-
                            Use:"cart"(CART 上游,走 CART Service 的 ClusterIP)、"backend"(discovery 的后端桶,pod IP)、
                            或 "backend-svc"(后端 Service 的 ClusterIP VIP,作最低优先级【静态兜底】——operator 宕+rollout 时
                            pod-IP 层全死也不全断,降级走 kube-proxy;需 discovery.service,selector 模式无 VIP 会被跳过)。
                          enum:
                          - cart
                          - backend
                          - backend-svc
                          type: string
                      required:
                      - use
                      type: object
                    minItems: 1
                    type: array
                  route:
                    description: |-
                      Route:路由短名(= conf 文件名 session_route_<route>.conf + openresty dict 名 + unix socket 名 <route>.sock
                      **字符集必须 ⊆ [a-z0-9._-]**:它要做 dispatch 的路径捕获正则 `^/(?<rkey>[a-z0-9._-]+)/`,含大写/其它字符
                      → dispatch 派生不到 <route>.sock → 该模型经 8080 永远打不通。故加 Pattern 强校验。
                    pattern: ^[a-z0-9._-]+$
                    type: string
                  selector:
                    description: Selector:可选;nginx 入口的 pod label 发现(没建 Service 时的兜底)。
                    type: string
                  service:
                    description: |-
                      Service:可选;nginx 入口自身的 Service("ns/name")→ 供 monitor 的 nginx: 行 + 入口 pod 扩缩事件驱动。
                      端口取 Service 的 dispatch 命名端口(8080,路径路由统一入口)。与 selector 二选一(都配则 service 优先)。
                    type: string
                  values:
                    additionalProperties:
                      type: string
                    description: |-
                      Values:任意调优项,原样渲染进 lua register_route 返回表(key = value)。nginx 加新调优项无需改代码。
                      常用:ttft_limit_ms、tps_limit_tps、adaptive_cc_min、default_max。值按 lua 字面量原样写(数字不加引号)。
                    type: object
                required:
                - outputConfigMap
                - peers
                type: object
              slo:
                description: |-
                  SLO:可选;有 = 把同 ns 里匹配本路由的 LLMSLORequirement 翻译进 openresty 的 slo.json。
                  没有 = 完全不碰 SLO(openresty 回落 nginx.values 里的静态 ttft_limit_ms / tps_limit_tps)。
                properties:
                  outputConfigMap:
                    description: |-
                      OutputConfigMap:autoconfig 写 slo.json 的 ConfigMap("ns/name",**所有 route 共享一个 key**)。
                      ⚠️ 这个 ConfigMap 绝不能挂进 openresty 的 /watch —— 那是 reload sidecar 的监视目录,
                      挂进去每次 SLO 变更都会触发一次 openresty reload,免 reload 的意义就没了。
                    type: string
                  serviceId:
                    description: |-
                      ServiceID:显式指定要读哪个 LLMSLORequirement 的 serviceId。
                      省略则自动推导:取 discovery.service 的名字部分、去掉可选的 "-leader" 后缀
                      (LWS 的 Service 惯例是 <serviceId>-leader)。三个线上模型都符合这个推导,
                      留这个字段是给不符合惯例的服务一个不用改名的出口。
                    type: string
                required:
                - outputConfigMap
                type: object
            required:
            - discovery
            - nginx
            type: object
            x-kubernetes-validations:
            - message: nginx.peers 用了 cart,但没配 spec.cart
              rule: '!self.nginx.peers.exists(s, s.use == ''cart'') || has(self.cart)'
            - message: cart 用了 maxConcurrencyFromBackend,必须给 backend 组配 maxConcurrency(>
                0)作乘数
              rule: '!self.nginx.peers.exists(s, s.use == ''cart'' && has(s.maxConcurrencyFromBackend)
                && s.maxConcurrencyFromBackend) || self.nginx.peers.exists(s, s.use
                == ''backend'' && has(s.maxConcurrency) && s.maxConcurrency > 0)'
          status:
            description: ModelRouteStatus 是 controller 回写的观测状态。
            properties:
              backends:
                type: integer
              cartPeers:
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              ready:
                type: boolean
            required:
            - backends
            - cartPeers
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
