# autoconfig controller(RouterBinding)部署参数。
image:
  repository: harbor.4pd.io/hardcore-tech/autoconfig
  tag: ""              # 缺省用 Chart.appVersion
  pullPolicy: Always   # tag 会被 CI overwrite,Always 避免用到节点旧缓存

replicas: 1            # >1 时 leader 选举保证只有一个在干活(HA)
leaderElection: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

serviceAccount:
  create: true
  name: ""             # 空 = 用 fullname

rbac:
  create: true         # 建 ClusterRole/Binding(controller 要跨 ns 管 configmap + watch pods/endpointslices)

crd:
  install: true        # 由本 chart 安装 CRD(带 helm.sh/resource-policy: keep,卸载不删,保护已有 RouterBinding)

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
