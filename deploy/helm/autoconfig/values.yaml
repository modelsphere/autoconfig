# autoconfig controller(ModelRoute)部署参数。
image:
  repository: harbor.4pd.io/hardcore-tech/autoconfig
  tag: ""              # 缺省用 Chart.appVersion
  pullPolicy: Always   # tag 会被 CI overwrite,Always 避免用到节点旧缓存

replicas: 1            # >1 时 leader 选举保证只有一个在干活(HA)
leaderElection: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

serviceAccount:
  create: true
  name: ""             # 空 = 用 fullname

rbac:
  create: true         # 建 ClusterRole/Binding(controller 要跨 ns 管 configmap + watch pods/endpointslices)

crd:
  install: true        # 由本 chart 安装 CRD(带 helm.sh/resource-policy: keep,卸载不删,保护已有 ModelRoute)

# 可选:直接在 chart 里声明 ModelRoute(免单独 kubectl apply)。由 helm 托管:
# helm uninstall 前随 release 删除、controller 还在 → 自动摘 finalizer,不会卡住。
# 每项:{ name, namespace(缺省 release ns), spec: {...ModelRouteSpec...} }
modelRoutes: []
#  - name: glm-5.1-fp8
#    namespace: glm
#    spec:
#      discovery: { service: glm-leader, port: 8050 }
#      cart: { service: cart-glm, port: 8071, outputConfigMap: glm/cart-config, baseConfigRef: { name: base-cart, key: config.base.yaml }, maxLoad: 20 }
#      openresty:
#        route: glm
#        listen: 18083
#        outputConfigMap: openresty/openresty-conf
#        sources: [ { use: cart, priority: 1, maxConcurrency: 180 }, { use: backend, priority: 0 } ]

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
