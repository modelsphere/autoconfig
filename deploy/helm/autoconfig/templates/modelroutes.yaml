{{- /* 可选:values.modelRoutes 里声明的 ModelRoute 由本 chart 一并创建。
       Helm 安装顺序按 kind 排序:CustomResourceDefinition 先于自定义资源,故 CRD 先建、RB 后建。 */ -}}
{{- range .Values.modelRoutes }}
---
apiVersion: routing.modelsphere.dev/v1alpha1
kind: ModelRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels: {{- include "autoconfig.labels" $ | nindent 4 }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
