{{- if .Values.crd.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routerbindings.routing.4pd.io
  annotations:
    helm.sh/resource-policy: keep   # 卸载不删 CRD(保护已有 RouterBinding);升级 CRD 请手动 kubectl apply
  labels: {{- include "autoconfig.labels" . | nindent 4 }}
spec:
  group: routing.4pd.io
  scope: Namespaced
  names:
    kind: RouterBinding
    listKind: RouterBindingList
    plural: routerbindings
    singular: routerbinding
    shortNames: [rb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Backends, type: integer, jsonPath: .status.backends }
        - { name: CART, type: integer, jsonPath: .status.cartPeers }
        - { name: Ready, type: boolean, jsonPath: .status.ready }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [discovery, openresty]
              properties:
                discovery:
                  type: object
                  required: [port]
                  properties:
                    service: { type: string }
                    selector: { type: string }
                    port: { type: integer }
                    includeNotReady: { type: boolean }
                  x-kubernetes-validations:
                    - rule: "has(self.service) != has(self.selector)"
                      message: "discovery: service 和 selector 必须恰好给一个"
                cart:
                  type: object
                  required: [port, outputConfigMap]
                  properties:
                    service: { type: string }
                    selector: { type: string }
                    port: { type: integer }
                    outputConfigMap: { type: string }
                    maxLoad: { type: integer }
                    baseConfigRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: { type: string }
                        key: { type: string }
                  x-kubernetes-validations:
                    - rule: "has(self.service) != has(self.selector)"
                      message: "cart: service 和 selector 必须恰好给一个"
                openresty:
                  type: object
                  required: [route, listen, sources, outputConfigMap]
                  properties:
                    route: { type: string }
                    listen: { type: integer }
                    outputConfigMap: { type: string }
                    values:
                      type: object
                      additionalProperties: { type: string }
                    sources:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [use]
                        properties:
                          use:
                            type: string
                            enum: [cart, backend]
                          priority: { type: integer }
                          maxConcurrency: { type: integer }
              x-kubernetes-validations:
                - rule: "!self.openresty.sources.exists(s, s.use == 'cart') || has(self.cart)"
                  message: "openresty.sources 用了 cart,但没配 spec.cart"
            status:
              type: object
              properties:
                observedGeneration: { type: integer }
                backends: { type: integer }
                cartPeers: { type: integer }
                ready: { type: boolean }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                      observedGeneration: { type: integer }
{{- end }}
