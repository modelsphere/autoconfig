# autoconfig CRD controller 部署(ModelRoute 调谐器)。
# 先装 CRD:kubectl apply -f config/crd/bases/routing.gpucluster.io_modelroutes.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: autoconfig-controller, namespace: autoconfig }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: autoconfig-controller }
rules:
- { apiGroups: ["routing.gpucluster.io"], resources: ["modelroutes"], verbs: ["get","list","watch","update","patch"] }
- { apiGroups: ["routing.gpucluster.io"], resources: ["modelroutes/status"], verbs: ["get","update","patch"] }
- { apiGroups: ["routing.gpucluster.io"], resources: ["modelroutes/finalizers"], verbs: ["update"] }
- { apiGroups: [""], resources: ["configmaps"], verbs: ["get","list","watch","create","update","patch","delete"] }
- { apiGroups: [""], resources: ["pods"], verbs: ["get","list","watch"] }                          # selector 兜底发现
- { apiGroups: ["discovery.k8s.io"], resources: ["endpointslices"], verbs: ["get","list","watch"] } # service EndpointSlice 发现
# leader 选举
- { apiGroups: ["coordination.k8s.io"], resources: ["leases"], verbs: ["get","list","watch","create","update","patch","delete"] }
- { apiGroups: [""], resources: ["events"], verbs: ["create","patch"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: autoconfig-controller }
subjects: [{ kind: ServiceAccount, name: autoconfig-controller, namespace: autoconfig }]
roleRef: { kind: ClusterRole, name: autoconfig-controller, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: autoconfig-controller, namespace: autoconfig }
spec:
  replicas: 1                       # leader 选举支持多副本 HA(replicas: 2 时只有 leader 干活)
  selector: { matchLabels: { app: autoconfig-controller } }
  template:
    metadata: { labels: { app: autoconfig-controller } }
    spec:
      serviceAccountName: autoconfig-controller
      terminationGracePeriodSeconds: 15    # 配合 manager GracefulShutdownTimeout(10s),pod 及时终止
      containers:
      - name: controller
        image: harbor.4pd.io/hardcore-tech/autoconfig:0.3.15
        imagePullPolicy: Always          # tag 可能被重推(CI overwrite),强制重拉避免用到节点旧缓存
        env:
        - { name: PS_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }  # leader lease 落本 ns
        resources: { requests: { cpu: "50m", memory: 64Mi }, limits: { cpu: "500m", memory: 256Mi } }
