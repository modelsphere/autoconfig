# autoconfig 中心 agent 部署示例(改 namespace / selector / outputConfigMap 后用)。
# 消费方 pod 里加 reload sidecar 的片段见文件末尾注释。
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: autoconfig, namespace: autoconfig }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole                       # 若 targets/输出跨多个 ns,用 ClusterRole 省事;单 ns 可换 Role
metadata: { name: autoconfig }
rules:
- { apiGroups: [""], resources: ["pods"], verbs: ["get","list","watch"] }                        # selector 兜底发现
- { apiGroups: ["discovery.k8s.io"], resources: ["endpointslices"], verbs: ["get","list","watch"] } # service EndpointSlice 发现
- { apiGroups: [""], resources: ["configmaps"], verbs: ["get","list","create","update","patch"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: autoconfig }
subjects: [{ kind: ServiceAccount, name: autoconfig, namespace: autoconfig }]
roleRef: { kind: ClusterRole, name: autoconfig, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: autoconfig-config, namespace: autoconfig }
data:
  config.yaml: |
    intervalSeconds: 5
    targets:
      # service:走 EndpointSlice(推荐)——前提是该 Service 只选服务端点(LWS Service 配成只选 leader)
      - { name: glm-5.1-fp8, namespace: glm, service: glm-leader, port: 8050 }
      # selector:pod label 发现(兜底)——没建 Service 的单机/单卡
      - { name: kimi-k2.6, namespace: kimi, selector: "leaderworkerset.sigs.k8s.io/name=kimi-k26,leaderworkerset.sigs.k8s.io/worker-index=0", port: 8050 }
    sinks:
      - kind: cart
        target: glm-5.1-fp8
        baseConfig: /base/cart/config.base.yaml
        outputConfigMap: glm/cart-config
        maxLoad: 20
      - kind: openresty
        baseConfigDir: /base/openresty
        routeByTarget: { kimi-k2.6: session_route_kimi-k2.6.conf, glm-5.1-fp8: session_route_glm.conf }
        outputConfigMap: openresty/openresty-conf
---
# CART 的 base config(非 workers 部分);openresty 的 base confs 放另一个 ConfigMap(ps-base-or,略)
apiVersion: v1
kind: ConfigMap
metadata: { name: base-cart, namespace: autoconfig }
data:
  config.base.yaml: |
    server: { host: "0.0.0.0", port: 6700 }
    cache: { threshold: 0.3 }
    health: { endpoint: "/health", interval_secs: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: autoconfig, namespace: autoconfig }
spec:
  replicas: 1
  selector: { matchLabels: { app: autoconfig } }
  template:
    metadata: { labels: { app: autoconfig } }
    spec:
      serviceAccountName: autoconfig
      containers:
      - name: agent
        image: harbor.4pd.io/hardcore-tech/autoconfig:0.1.0
        args: ["--config","/etc/autoconfig/config.yaml"]
        resources: { requests: { cpu: "50m", memory: 64Mi }, limits: { cpu: "500m", memory: 256Mi } }
        volumeMounts:
        - { name: cfg,  mountPath: /etc/autoconfig }
        - { name: cart, mountPath: /base/cart }
        # - { name: or, mountPath: /base/openresty }   # openresty base confs ConfigMap
      volumes:
      - { name: cfg,  configMap: { name: autoconfig-config } }
      - { name: cart, configMap: { name: base-cart } }
      # - { name: or, configMap: { name: base-openresty } }
#
