---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: modelroutes.routing.gpucluster.io
spec:
  group: routing.gpucluster.io
  names:
    kind: ModelRoute
    listKind: ModelRouteList
    plural: modelroutes
    shortNames:
    - mr
    singular: modelroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.backends
      name: Backends
      type: integer
    - jsonPath: .status.cartPeers
      name: CART
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelRoute 把「一个模型的后端」自动同步到 openresty 的 peers 与 CART 的 workers。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelRouteSpec 是一个模型的完整路由绑定。
            properties:
              cart:
                description: Cart:可选;有 = autoconfig 管这个 CART,无 = nginx 直连后端。
                properties:
                  maxLoad:
                    description: MaxLoad:每 worker 的 max_load,默认 20。
                    type: integer
                  outputConfigMap:
                    description: |-
                      OutputConfigMap:autoconfig 写 CART 的 config.yaml 到这("ns/name")。
                      底稿(server/cache/health)由 chart 的 values.baseConfig 建在此 ConfigMap 里;autoconfig 只重填 workers 段。
                    type: string
                  port:
                    description: Port:CART 端口。省略则从 EndpointSlice/containerPort 自动推导(单端口)。
                    type: integer
                  selector:
                    type: string
                  service:
                    description: CART pod 的发现(供 openresty 的 cart source);service/selector
                      二选一。service 支持 "ns/name" 跨 ns。
                    type: string
                required:
                - outputConfigMap
                type: object
                x-kubernetes-validations:
                - message: 'cart: service 和 selector 必须恰好给一个'
                  rule: has(self.service) != has(self.selector)
              discovery:
                description: Discovery:本模型的后端桶(喂 CART 的 workers、nginx 的 backend 来源、monitor
                  的 services)。
                properties:
                  includeNotReady:
                    description: IncludeNotReady:默认 false 只取 Ready 端点(排空中端点自动排除)。
                    type: boolean
                  port:
                    description: Port:后端服务端口(配 pod IP)。省略则自动推导:service 路径从 EndpointSlice
                      取、selector 路径从 containerPort 取(仅单端口可推)。
                    type: integer
                  selector:
                    description: Selector:走 pod label 发现(兜底:没建 Service 的单机/单卡)。
                    type: string
                  service:
                    description: |-
                      Service:走 EndpointSlice 发现(推荐);该 Service 需只选服务端点(LWS Service 配成只选 leader)。
                      支持 "ns/name" 跨 ns 发现(裸名默认与 ModelRoute 同 ns),让 ModelRoute 可放中心 ns。
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'discovery: service 和 selector 必须恰好给一个'
                  rule: has(self.service) != has(self.selector)
              monitor:
                description: Monitor:可选;有 = 把发现的后端也写进 monitor 的 services(monitor 60s
                  自热加载,无 sidecar)。
                properties:
                  gpuType:
                    description: |-
                      GPUType:monitor service 行的 gpu_type 字段(如 H100 / A100 / H200)。省略 = 从后端所在节点的
                      GPU label(nvidia.com/gpu.product,GFD 打)自动推导成短名;推不出(无 label / 无 GFD)则留空。显式配则覆盖。
                    type: string
                  model:
                    description: Model:monitor service 行的 model 字段(served-model-name);省略
                      = metadata.name。
                    type: string
                  nginx:
                    description: |-
                      Nginx:可选,默认 true(当 spec.nginx 配了 service/selector);复用 nginx 入口发现,写 monitor 的 nginx: 行
                      (端口用 spec.nginx.listen,每端口 = 一个模型,name = 本模型)。设 false 关闭。
                    type: boolean
                  outputConfigMap:
                    description: OutputConfigMap:autoconfig 写 monitor 配置的 ConfigMap("ns/name",多模型共享,每模型一个
                      key)。
                    type: string
                  router:
                    description: 'Router:可选,默认 true(当配了 spec.cart);复用 spec.cart 发现的
                      CART pod,写 monitor 的 router: 表(.../workers)。设 false 关闭。'
                    type: boolean
                required:
                - outputConfigMap
                type: object
              nginx:
                description: Nginx:nginx(openresty)路由。
                properties:
                  listen:
                    description: |-
                      Listen:【路径路由 D″ 下已废弃】per-model server 不再监听 TCP 端口,改监听 unix socket
                      (名 = route),由镜像 baked 的 8080 dispatch 按 /<route>/ 分发;monitor 探 8080/<route>。保留字段仅向后兼容,忽略。
                    type: integer
                  outputConfigMap:
                    description: OutputConfigMap:输出 ConfigMap("ns/name",多路由共享,每路由一个
                      key)。
                    type: string
                  peers:
                    description: Peers:有序 peer 组(如 cart 优先 + backend 兜底)。
                    items:
                      description: RoutePeer:openresty 一条 route 的一组 peer 来源(cart 组
                        / backend 组)。
                      properties:
                        maxConcurrency:
                          description: MaxConcurrency:该组所有 peer 的并发上限;省略用 values.default_max。
                          type: integer
                        maxConcurrencyFromBackend:
                          description: |-
                            MaxConcurrencyFromBackend:仅 use:cart 有意义。true = cart 的并发上限动态 = 后端单实例并发 × 后端数
                            (CART 扇出到 N 个后端,总容量=各后端容量之和,随后端扩缩自动变)。设了它就忽略静态 MaxConcurrency。
                            后端单实例并发取 use:backend 组的 maxConcurrency —— CEL 校验强制此时它必须 > 0(见 ModelRouteSpec)。
                          type: boolean
                        priority:
                          description: Priority:openresty peer 优先级(CART 优先=1,后端兜底=0)。
                          type: integer
                        use:
                          description: Use:"cart"(引用本模型的 CART pod)或 "backend"(引用 discovery
                            的后端桶)。
                          enum:
                          - cart
                          - backend
                          type: string
                      required:
                      - use
                      type: object
                    minItems: 1
                    type: array
                  route:
                    description: |-
                      Route:路由短名(openresty dict/register 用,= conf 文件名 session_route_<route>.conf)。
                      省略 = 用 metadata.name。⚠️ 会做 openresty lua_shared_dict 名(active_conns_<route> 等),
                      想用简单标识(字母数字/下划线)或 name 含 -/. 时,显式给个短 route。
                    type: string
                  selector:
                    description: Selector:可选;nginx 入口的 pod label 发现(没建 Service 时的兜底)。
                    type: string
                  service:
                    description: |-
                      Service:可选;nginx 入口自身的 Service("ns/name")→ 供 monitor 的 nginx: 行 + 入口 pod 扩缩事件驱动。
                      端口用本模型的 listen(每端口 = 一个模型)。与 selector 二选一(都配则 service 优先)。
                    type: string
                  values:
                    additionalProperties:
                      type: string
                    description: |-
                      Values:任意调优项,原样渲染进 lua register_route 返回表(key = value)。nginx 加新调优项无需改代码。
                      常用:ttft_limit_ms、tps_limit_tps、adaptive_cc_min、default_max。值按 lua 字面量原样写(数字不加引号)。
                    type: object
                required:
                - outputConfigMap
                - peers
                type: object
            required:
            - discovery
            - nginx
            type: object
            x-kubernetes-validations:
            - message: nginx.peers 用了 cart,但没配 spec.cart
              rule: '!self.nginx.peers.exists(s, s.use == ''cart'') || has(self.cart)'
            - message: cart 用了 maxConcurrencyFromBackend,必须给 backend 组配 maxConcurrency(>
                0)作乘数
              rule: '!self.nginx.peers.exists(s, s.use == ''cart'' && has(s.maxConcurrencyFromBackend)
                && s.maxConcurrencyFromBackend) || self.nginx.peers.exists(s, s.use
                == ''backend'' && has(s.maxConcurrency) && s.maxConcurrency > 0)'
          status:
            description: ModelRouteStatus 是 controller 回写的观测状态。
            properties:
              backends:
                type: integer
              cartPeers:
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              ready:
                type: boolean
            required:
            - backends
            - cartPeers
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
