# 示例:glm-5.1-fp8 —— ModelRoute 放【中心 ns routing】,跨 ns 发现各组件(service 用 ns/name)。
# service 写 "ns/name" 跨 ns;裸名则与本 ModelRoute 同 ns。port 省略 → 从 Service 的 EndpointSlice 自动取。
apiVersion: routing.modelsphere.dev/v1alpha1
kind: ModelRoute
metadata:
  name: glm-5.1                       # ← 短标识即可;served-model-name 在 monitor.model 单独给(见下)
  namespace: routing                 # ← 中心 ns;后端/组件都在别的 ns,靠下面的 ns/name 跨 ns 发现
spec:
  discovery:                         # 后端桶(喂 CART workers + nginx backend 来源)
    service: glm/glm-leader          # ns/name:glm ns 的 leader Service(EndpointSlice 只选 leader)
    # port 省略 → 从 EndpointSlice 自动取(单端口);多端口/selector 才需显式 port: 8050
  cart:                              # 可选;省略 = nginx 直连后端。⚠️ CART 一个模型一个,下面都是本模型专属(非共享)
    service: glm/cart-glm            # ns/name:glm ns 里本模型的 CART Service。nginx 的 cart peer 走它的 ClusterIP(VIP,
                                     #   非 pod IP)→ CART master-standby failover/rollout 对 openresty 透明(VIP 恒指 active leader)
    # port 省略 → 取 Service 的 frontend 端口(单端口自动;VIP 兜底同理)
    outputConfigMap: glm/cart-glm-config  # 本模型专属 = cart chart 的 <fullname>-config(cart-glm → cart-glm-config);autoconfig 只重填 workers 段
    maxLoad: 20                      # 每 worker 的 max_load(默认 20)
  nginx:                             # nginx(openresty)路由 —— 路径路由:外部经单口 8080/<route>/ 访问
    # route 省略 = metadata.name(glm-5.1);= conf 文件名 + openresty dict 名 + 【外部路径 key + unix socket 名】
    # listen 已废弃:per-model server 只监听 unix socket(名=route),镜像 baked 的 8080 dispatch 按 /<route>/ 分发
    outputConfigMap: openresty/openresty-conf   # 【共享】一个 nginx 服务所有模型;每模型一个 key(session_route_glm-5.1.conf)
    service: openresty/openresty     # 可选:nginx 入口 Service(ns/name)→ monitor 的 nginx: 行(探 8080/<route>)+ 入口 pod 扩缩事件驱动
    values:                          # 任意调优项,原样渲染进 lua(nginx 加新项无需改代码;数字不加引号)
      ttft_limit_ms: "60000"
      default_max:   "120"           # 没配 maxConcurrency 的 peer 默认并发
    peers:                           # 有序 peer 组(数字大=优先;高优层全 banned 才级联到低层):CART → 后端 pod → VIP 兜底
      - { use: cart,        priority: 3,  maxConcurrencyFromBackend: true } # CART(ClusterIP);动态并发=后端单实例 × 后端数
      - { use: backend,     priority: 2,  maxConcurrency: 120 }             # 后端 pod IP(亲和/least_conn 主力);单实例并发 120
      - { use: backend-svc, priority: 1 }                                  # 后端 Service ClusterIP【静态兜底】:operator 宕+rollout
                                                                           #   致 pod-IP 层全死时级联到 VIP(kube-proxy 维护)→ 降级不全断
  # (backend-svc 需 discovery.service;selector 模式无 VIP 会被自动跳过)
  slo:                                # 可选:把 LLMSLORequirement(inference.modelsphere.dev)下发给 openresty
    name: glm                           # 必填:LLMSLORequirement 的 metadata.name,支持 ns/name 跨 ns
    # → 翻译成 ttft_metrics / tps_metrics 渲染进本路由的 conf,优先级高于上面 values 里的静态阈值。
  monitor:                           # 可选;把后端写进 monitor 的 services(monitor 60s 自热加载,无 sidecar)
    outputConfigMap: monitor/monitor-conf   # 【共享】一个 monitor 看所有模型;每模型一个 key(glm-5.1.monitor.conf)
    model: glm-5.1-fp8               # served-model-name;省略则用 metadata.name(glm-5.1)。名字比 CR 详细时在这给
    # gpuType 省略 = 从后端所在节点的 GPU label(nvidia.com/gpu.product,GFD)自动推导成 H100/A100/…;推不出或想覆盖才显式写:
    # gpuType: H100
    # nginx / router 默认都开(因为上面配了 spec.nginx.service 和 spec.cart);各自复用那边的发现,不用再配一遍。设 false 关:
    # nginx: false                   #   关 monitor 的 nginx: 行
    # router: false                  #   关 monitor 的 router: 行(.../workers)
---
# 无 CART 的例子:nginx 直连后端(省略 cart 段,sources 只有 backend)
apiVersion: routing.modelsphere.dev/v1alpha1
kind: ModelRoute
metadata:
  name: kimi-k2.6
  namespace: kimi
spec:
  discovery:
    # selector 路径按【本 ModelRoute 的 ns】(kimi)发现,不支持 ns/name;port 也可省略(从 containerPort 自动取)
    selector: "leaderworkerset.sigs.k8s.io/name=kimi-k26,leaderworkerset.sigs.k8s.io/worker-index=0"
  nginx:
    # route 省略 = metadata.name(kimi-k2.6)→ session_route_kimi-k2.6.conf + socket kimi-k2.6.sock;外部走 8080/kimi-k2.6/
    outputConfigMap: openresty/openresty-conf
    peers:
      - { use: backend }
  slo:                                # 可选:把 LLMSLORequirement(inference.modelsphere.dev)下发给 openresty
    name: kimi-k26                      # 必填:LLMSLORequirement 的 metadata.name,支持 ns/name 跨 ns
    # → 翻译成 ttft_metrics / tps_metrics 渲染进本路由的 conf,优先级高于上面 values 里的静态阈值。
