# 示例:glm-5.1-fp8 —— ModelRoute 放【中心 ns routing】,跨 ns 发现各组件(service 用 ns/name)。
# service 写 "ns/name" 跨 ns;裸名则与本 ModelRoute 同 ns。port 省略 → 从 Service 的 EndpointSlice 自动取。
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: glm-5.1-fp8
  namespace: routing                 # ← 中心 ns;后端/组件都在别的 ns,靠下面的 ns/name 跨 ns 发现
spec:
  discovery:                         # 后端桶(喂 CART workers + openresty backend 来源)
    service: glm/glm-leader          # ns/name:glm ns 的 leader Service(EndpointSlice 只选 leader)
    # port 省略 → 从 EndpointSlice 自动取(单端口);多端口/selector 才需显式 port: 8050
  cart:                              # 可选;省略 = openresty 直连后端。⚠️ CART 一个模型一个,下面都是本模型专属(非共享)
    service: glm/cart-glm            # ns/name:glm ns 里本模型的 CART Service(每模型独立;发现它 → openresty cart peer + monitor router)
    # port 省略 → 自动取(CART 端口)
    outputConfigMap: glm/cart-glm-config  # 本模型专属 = cart chart 的 <fullname>-config(cart-glm → cart-glm-config);autoconfig 只重填 workers 段
    maxLoad: 20                      # 每 worker 的 max_load(默认 20)
  openresty:
    route: glm
    listen: 18083
    outputConfigMap: openresty/openresty-conf   # 【共享】一个 openresty 服务所有模型;每模型一个 key(session_route_glm.conf)
    values:                        # 任意调优项,原样渲染进 lua(openresty 加新项无需改代码;数字不加引号)
      ttft_limit_ms: "60000"
      default_max:   "120"         # 没配 maxConcurrency 的 peer 默认并发
    peers:                         # 有序 peer 组:CART 优先 + 后端兜底
      - { use: cart,    priority: 1, maxConcurrencyFromBackend: true }   # 动态并发=后端单实例 × 后端数(随扩缩自动变)
      - { use: backend, priority: 0, maxConcurrency: 120 }               # 后端单实例并发 120(cart 动态并发的乘数)
  monitor:                           # 可选;把后端写进 monitor 的 services(monitor 60s 自热加载,无 sidecar)
    outputConfigMap: monitor/monitor-conf   # 【共享】一个 monitor 看所有模型;每模型一个 key(glm-5.1-fp8.monitor.conf)
    model: glm-5.1-fp8
    gpuType: H100
    nginx:                           # 可选;探测 openresty 入口 → monitor 的 nginx: 行
      service: openresty/openresty   # openresty 入口 Service(ns/name);端口用本模型的 openresty.listen(每端口=一个模型),不用写 port
    # router 默认 true(有 cart 时):把探测到的 CART pod 写进 monitor 的 router: 表(.../workers)。设 false 关闭。
---
# 无 CART 的例子:openresty 直连后端(省略 cart 段,sources 只有 backend)
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: kimi-k2.6
  namespace: kimi
spec:
  discovery:
    # selector 路径按【本 ModelRoute 的 ns】(kimi)发现,不支持 ns/name;port 也可省略(从 containerPort 自动取)
    selector: "leaderworkerset.sigs.k8s.io/name=kimi-k26,leaderworkerset.sigs.k8s.io/worker-index=0"
  openresty:
    route: k26
    listen: 18082
    outputConfigMap: openresty/openresty-conf
    peers:
      - { use: backend }
