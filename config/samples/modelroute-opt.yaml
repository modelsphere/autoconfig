# 示例:opt-125m 测试路由 —— 三层 peer(cart 优先 → backend pod-IP → backend-svc VIP 兜底)。
# 后端由 config/samples/opt-backend.yaml 部署(opt ns 的 vLLM + opt-svc);此 ModelRoute 放中心 ns llm-route,
# 跨 ns 发现后端(discovery.service 用 "opt/opt-svc")。autoconfig 据此写:
#   - openresty-conf(session_route_opt.conf 的 peers)
#   - cart-config(workers)
#   - monitor-conf(opt.monitor.conf 的 service/nginx/router 行)
# 带 backend-svc 兜底层 → autoconfig(≥0.3.29)自动注入 cross_tier_fallback=true + max_more_tries=3。
# 所有 service / outputConfigMap 均为 ns/name 全限定 → 本 ModelRoute 放哪个 ns 都行(引用不依赖它)。
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: opt
  namespace: llm-route                # 任意 ns 均可(所有引用已全限定)
spec:
  discovery:                          # 后端桶(喂 cart workers + nginx backend 来源)
    service: opt/opt-svc              # ns/name 跨 ns:opt ns 的 opt-svc;EndpointSlice 自动取就绪 pod
    port: 8000
  cart:                               # cache-aware-router —— ⚠️ 每个模型一个【专属 cart】,不共享(cache 亲和只对一个模型)
    service: llm-route/cart-opt       # ns/name 全限定:本模型专属 cart Service;nginx 的 cart peer 走它的 ClusterIP VIP
    port: 8071
    outputConfigMap: llm-route/cart-opt-config   # 专属 config(= cart helm chart 的 <fullname>-config,fullnameOverride=cart-opt)
    maxLoad: 20                       # 每 worker 的 max_load
  nginx:                              # openresty 路由(路径路由:外部经 8080/opt/ 访问)
    route: opt                        # = conf 文件名 + dict 名 + unix socket 名 + 外部路径 key
    service: llm-route/openresty      # ns/name:openresty 入口 Service 全限定
    outputConfigMap: llm-route/openresty-conf
    values:                           # 动态限流(自适应并发 AIMD):配 tps_limit_tps 即 opt-in 开启
      tps_limit_tps: "30"             #   解码速率下限(tok/s):EWMA 低于它→AIMD 缩并发上限,高于它→涨
      #                               #   配了它且未显式 adaptive_cc:false → adaptive_cc 按全局默认自动开
      # adaptive_cc_min: "10"         #   可选:并发下限(不配 = 静态 max × 全局 min_frac 派生)
    peers:                            # 有序三层;priority 大=优先
    - { use: cart,        priority: 3, maxConcurrencyFromBackend: true }  # 主:cart(并发上限随后端数自动变)
    - { use: backend,     priority: 2, maxConcurrency: 100 }              # 次:直连后端 pod-IP
    - { use: backend-svc, priority: 1 }                                   # 兜底:后端 Service VIP(operator 挂时靠它)
  slo:                                # 可选:把 LLMSLORequirement(inference.x-k8s.io)下发给 openresty
    serviceId: opt-13b            #   **必填**:要读同 ns 里哪个 LLMSLORequirement 的 spec.serviceId。
    #                                 #   不做任何推导 —— 关联关系必须写出来,不能从 Service 名猜
    #                                 #   (猜错不报错:要么静默回落静态阈值,要么套用别人的 SLO)。
    #                                 #   匹配的是 CRD 的 spec.serviceId,不是 CRD 的对象名。
    #                                 #   没匹配上 → status 的 SLOSynced condition reason=NoRequirement。
    #
    # 配了 slo 之后,匹配到的 LLMSLORequirement 会被翻译成
    # ttft_metrics / tps_metrics 渲染进本路由的 conf,**优先级高于上面 values 里的静态阈值**。
  monitor:                            # 可选:monitor 的 service/nginx/router 行
    model: opt-125m                   # served-model-name(monitor 展示用)
    gpuType: A100
    outputConfigMap: monitoring/monitor-conf
