# 示例:MiniMax H3(视频生成)—— modelType: video,纯反向代理路由。
#
# 和 LLM 路由的差别在 spec.modelType:
#   llm(默认)  走 lua 路由引擎:会话亲和、TTFT/TPS 限流、自适应并发、CART 前置;
#   video      渲染成纯反向代理:不解析请求体、不限流,放开超时(一条片子 1~3 分钟)、
#              关响应缓冲(几十 MB 视频边收边发)、透传 Range(断点续传)、
#              补齐 X-Forwarded-Host/Proto(下游按它拼下载 URL)。
# CEL 会拒掉 video + cart / slo / monitor / LLM 调优项的组合 —— 那些在纯反代里没人读,
# 配了以为生效才是最坑的。
#
# 后端是 H3 的 Router(minimax_h3_code 的 helm chart 部署),它再按能力分发到
# fl2va / ref2va 两个池。所以这里的 discovery 指 Router 的 Service。
#
# 路径:dispatch(8080)按 /<route>/ 分发并**剥掉前缀**,H3 收到的是干净的 /v2/...。
# 对外地址因此是 https://<域名>/minimax-h3/v2/video_generation,
# H3 生成下载 URL 时要把这个前缀算进去 —— 在 H3 侧配:
#   server.config.publicBaseUrl: https://<域名>/minimax-h3
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: minimax-h3
  namespace: llm-route                     # 任意 ns 均可(下面引用都是 ns/name 全限定)
spec:
  modelType: video                         # ← 关键:视频生成,渲染纯反向代理
  discovery:
    service: minimax-h3/h3-minimax-h3-router   # H3 Router 的 Service
    port: 8080
  nginx:
    route: minimax-h3                      # 外部路径 key:/minimax-h3/...
    service: llm-route/openresty
    outputConfigMap: llm-route/openresty-conf
    # video 建议只用 backend-svc(Service 的 ClusterIP VIP),不要列 pod IP:
    #   * 负载均衡与健康感知交给 k8s(只转发给 Ready 的 Pod),纯反代不需要 nginx 自己轮询;
    #   * Router 扩缩/滚动时 conf 内容不变 -> **不触发 openresty reload**。
    #     openresty 是所有模型共享的入口,列 pod IP 的话 H3 每次滚动都会让它 reload 一次。
    # 想让 nginx 自己在多个 Router pod 间轮询(例如要观察每个 pod 的分布),再改成
    # use: backend(可再加一条 backend-svc priority 更低作兜底,会渲染成 nginx 的 backup)。
    peers:
      - use: backend-svc
    values:                                # video 只认这三个旋钮(其余会被 CEL 拒)
      max_body_size: 64m                   # I2V 允许 base64 传图,上游自己在 64MB 处拒
      proxy_timeout: 3600s                 # 生成 + 大文件下载,超时按小时给
      connect_timeout: 10s
      # 下载限速是可选的:**不配就不限速**。要限就写 rate_limit(接受 200Mbps/1.5Gbps
      # 这类比特口径,自动换算成 nginx 的字节/秒;也接受 25m/512k 的 nginx 原生写法)。
      # rate_limit: 200Mbps
      # rate_limit_after: 1m               # 前 N 字节全速,默认 1m,只在配了 rate_limit 时有意义
  # 注意:video 不配 cart / slo / monitor —— 前两个是 LLM 专用;
  # monitor 的探活与告警按 LLM 端点设计,指向 H3 只会产生假告警,
  # 视频服务的可观测走 Prometheus(H3 自己的 /metrics/queue)。
    # 上传方向的闸门(可选,都不配 = 不限)。nginx 没有请求体的字节级限速指令,
    # 能控的是并发数和请求速率 —— 单个来源的入向带宽 = 并发数 × 单条速率。
    # upload_conn_limit: "4"      # 每 IP 同时在传的连接数,超出直接 503
    # upload_req_limit: "10r/s"   # 每 IP 请求速率(nginx 原生写法)
    # upload_req_burst: "20"      # 允许的突发条数
