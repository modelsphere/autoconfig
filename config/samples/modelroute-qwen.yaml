# 示例:qwen(Qwen3.5-4B sglang)3 层路由 —— cart-qwen → backend pod-IP → backend-svc VIP 兜底。
# 后端由 config/samples/qwen-backend.yaml 部署(qwen ns 的 sglang + qwen-svc)。
# 前置:cart-qwen 需先用 cache_aware_router helm chart 装(一个模型一个 cart):
#   helm -n llm-route install cart-qwen <cart-chart> \
#     --set fullnameOverride=cart-qwen \
#     --set reload.image=harbor.4pd.io/hardcore-tech/autoconfig-reload:0.3.33 \
#     --set ha.image=harbor.4pd.io/hardcore-tech/autoconfig-hagate:0.3.33
#   (cart 起始 initContainer 等 cart-qwen-config 有 workers → 本 ModelRoute apply 后 autoconfig 写入即就绪)
# autoconfig 据此写 openresty-conf(session_route_qwen.conf)+ cart-qwen-config(workers)。
# 所有 service / outputConfigMap 均为 ns/name 全限定 → controller 全集群 watch,本 ModelRoute 放哪个 ns 都行
# (下面 namespace 仅示例;换成 qwen 等任意 ns 不影响,引用不依赖它)。
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: qwen
  namespace: llm-route                # 任意 ns 均可(所有引用已全限定)
spec:
  discovery:                          # 后端桶(喂 cart workers + nginx backend)
    service: qwen/qwen-svc           # ns/name 跨 ns:qwen ns 的 qwen-svc
    port: 8000
  cart:                               # 本模型专属 cart(cache-aware-router)
    service: llm-route/cart-qwen      # ns/name:全限定,不依赖本 ModelRoute 部署在哪个 ns
    port: 8071
    outputConfigMap: llm-route/cart-qwen-config
    maxLoad: 20
  nginx:                              # openresty 路由(外部经 8080/qwen/ 访问)
    route: qwen
    service: llm-route/openresty      # ns/name:openresty 入口 Service 全限定
    outputConfigMap: llm-route/openresty-conf
    values:                           # 动态限流(自适应并发 AIMD):配 tps_limit_tps 即 opt-in 开启
      tps_limit_tps: "30"             #   解码速率下限(tok/s):EWMA 低于它→AIMD 缩并发上限,高于它→涨
      #                               #   配了它且未显式 adaptive_cc:false → adaptive_cc 按全局默认自动开
      # adaptive_cc_min: "10"         #   可选:并发下限(不配 = 静态 max × 全局 min_frac 派生)
    peers:                            # 3 层,priority 大=优先
    - { use: cart,        priority: 3, maxConcurrencyFromBackend: true }  # 主:cart-qwen
    - { use: backend,     priority: 2, maxConcurrency: 100 }              # 次:直连后端 pod-IP
    - { use: backend-svc, priority: 1 }                                   # 兜底:qwen-svc VIP
  slo:                                # 可选:把 LLMSLORequirement(inference.x-k8s.io)下发给 openresty
    {}                                #   空对象即可 —— serviceId 默认从 discovery.service 推导
    #                                 #   (取名字部分并去掉可选的 "-leader" 后缀,LWS 的 Service 惯例)
    # serviceId: qwen-svc             #   ⚠️ 推导依赖命名惯例。不符合惯例、或推错时显式指定。
    #                                 #   推导结果会出现在 status 的 SLOSynced condition message 里;
    #                                 #   推错的表现是 reason=NoRequirement 且能看到用的是哪个 id。
    #
    # 配了 slo 之后,同 ns 里 spec.serviceId 匹配的 LLMSLORequirement 会被翻译成
    # ttft_metrics / tps_metrics 渲染进本路由的 conf,**优先级高于上面 values 里的静态阈值**。
    # 没有匹配的 CRD → 回落静态,condition 报 True/NoRequirement(不是错误)。
    # ⚠️ 不要在 values 里手写 ttft_metrics / tps_metrics:那里的值会被 luaVal 加引号变成字符串,
    #    引擎的 validate_metrics 会整份丢弃;而且本段生成的同名键渲染在后面,会覆盖它。
  monitor:                            # monitor 的 service/nginx/router 行(不配则无 qwen 监控)
    model: qwen                       # served-model-name(monitor 展示用)
    gpuType: A100
    outputConfigMap: monitoring/monitor-conf
